
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doğum Günün Kutlu Olsun Mustafa 💙</title>
<style>
body {
  margin: 0;
  padding: 0;
  height: 100vh;
  overflow: hidden;
  font-family: 'Segoe UI', sans-serif;
  text-align: center;
  color: white;
  position: relative;
  background: linear-gradient(to top, #003366, #ff9966);
  transition: background 20s linear;
}

/* Başlık ve mesaj */
h1 {
  font-size: 2.4em;
  text-shadow: 2px 2px 8px #000;
  animation: fadeIn 2s ease-in-out;
  position: relative;
  z-index: 5;
}

#mesaj {
  font-size: 1.5em;
  opacity: 0;
  margin-top: 15px;
  animation: mesajFade 3s ease-in-out 2s forwards;
  position: relative;
  z-index: 5;
  text-shadow: 1px 1px 5px #000;
}

@keyframes fadeIn {from {opacity: 0; transform: translateY(20px);} to {opacity: 1; transform: translateY(0);}}
@keyframes mesajFade {from {opacity:0; transform:translateY(10px);} to {opacity:1; transform:translateY(0);}}

/* Buton */
button {
  background: rgba(255,255,255,0.2);
  border: 1px solid #fff;
  color: white;
  padding: 12px 24px;
  font-size: 1.1em;
  border-radius: 30px;
  margin-top: 30px;
  backdrop-filter: blur(4px);
  cursor: pointer;
  transition: all 0.3s ease;
  position: relative;
  z-index: 5;
}
button:hover {background: rgba(255,255,255,0.4); transform: scale(1.05);}

/* Güneş ve ışık */
.sun {
  position: absolute;
  bottom: 120px;
  left: 50%;
  transform: translateX(-50%);
  width: 120px;
  height: 120px;
  background: radial-gradient(circle, #ffcc33, #ff6600);
  border-radius: 50%;
  animation: sunset 20s ease-in-out forwards, sway 5s infinite alternate;
  z-index: 1;
}

.sun-reflection {
  position: absolute;
  bottom: 120px;
  left: 50%;
  transform: translateX(-50%);
  width: 140px;
  height: 140px;
  background: radial-gradient(circle, rgba(255,255,255,0.2), transparent);
  border-radius: 50%;
  filter: blur(30px);
  z-index: 2;
  animation: reflection 20s ease-in-out forwards;
}

@keyframes sunset {
  0% { bottom: 120px; background: radial-gradient(circle, #ffcc33, #ff6600);}
  50% { bottom: 60px; background: radial-gradient(circle, #ff9966, #cc3300);}
  100% { bottom: -60px; background: radial-gradient(circle, #663300, #330000);}
}
@keyframes sway {0% { transform: translateX(-52%) } 100% { transform: translateX(-48%) }}
@keyframes reflection {0% { bottom:120px; opacity:0.6;} 50% {bottom:60px; opacity:0.3;} 100% {bottom:-60px; opacity:0;}}

/* Dalga katmanları ve renk geçişi */
.wave, .wave2, .wave3 {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 200%;
  border-radius: 100%;
  z-index: 3;
  transition: background 20s linear;
}
.wave {height:180px; background: rgba(255,140,0,0.3); animation: wave 8s infinite linear;}
.wave2 {height:150px; background: rgba(255,100,0,0.2); animation: wave 12s infinite linear reverse;}
.wave3 {height:120px; background: rgba(0,50,100,0.25); animation: wave 15s infinite linear;}

@keyframes wave {
  0% {transform: translateX(0);}
  100% {transform: translateX(-50%);}
}

/* Parlaklık efektleri */
.shine {
  position: absolute;
  bottom: 0;
  width: 5px;
  height: 80px;
  background: linear-gradient(to top, rgba(255,255,255,0.5), transparent);
  border-radius: 50%;
  opacity: 0.7;
  animation: shineMove 3s linear infinite;
  z-index: 4;
}
@keyframes shineMove {0% {transform: translateY(0);} 100% {transform: translateY(-100vh);}}

/* Konfeti */
.confetti {
  position: absolute;
  width: 15px;
  height: 15px;
  top: -20px;
  opacity: 0.9;
  border-radius: 50%;
  z-index: 10;
  animation: fall linear forwards;
  --sway: 30px;
}

@keyframes fall {
  0% { transform: translateY(0) translateX(0) rotate(0deg); }
  100% { transform: translateY(100vh) translateX(var(--sway)) rotate(360deg); }
}
</style>
</head>
<body>

<div class="sun"></div>
<div class="sun-reflection"></div>

<h1>Doğum Günün Kutlu Olsun Mustafa 💙</h1>
<div id="mesaj">Nice mutlu yıllara sevgili Mus! 🌅</div>
<button id="sesBtn">🔊 Deniz Sesini Aç</button>

<div class="wave"></div>
<div class="wave2"></div>
<div class="wave3"></div>

<script>
// Deniz sesi
const denizSesi = new Audio('deniz.mp3');
denizSesi.loop = true;
function baslatSes() {
  denizSesi.play().then(() => {
    document.getElementById('sesBtn').textContent = '🔇 Sesi Durdur';
  }).catch(err => console.log('Ses başlatılamadı:', err));
  document.removeEventListener('touchstart', baslatSes);
  document.removeEventListener('click', baslatSes);
}
document.addEventListener('touchstart', baslatSes, { once: true });
document.addEventListener('click', baslatSes, { once: true });
document.getElementById('sesBtn').addEventListener('click', () => {
  if (denizSesi.paused) {
    denizSesi.play();
    document.getElementById('sesBtn').textContent = '🔇 Sesi Durdur';
  } else {
    denizSesi.pause();
    document.getElementById('sesBtn').textContent = '🔊 Deniz Sesini Aç';
  }
});

// Konfeti
function createConfetti() {
  const confetti = document.createElement('div');
  confetti.classList.add('confetti');

  // Yatay başlangıç
  confetti.style.left = Math.random() * 100 + 'vw';

  // Renk
  confetti.style.background = `hsl(${Math.random()*360}, 100%, 60%)`;

  // Boyut
  const size = 10 + Math.random()*10;
  confetti.style.width = size + 'px';
  confetti.style.height = size + 'px';

  // Animasyon süresi
  const duration = 4 + Math.random()*3;
  confetti.style.animationDuration = duration + 's';

  // Yatay kayma (rüzgar etkisi)
  const sway = -30 + Math.random()*60; // -30px ile +30px
  confetti.style.setProperty('--sway', sway + 'px');

  document.body.appendChild(confetti);

  setTimeout(() => confetti.remove(), duration*1000);
}
setInterval(createConfetti, 150);

// Parlaklık efektleri
function createShine() {
  const shine = document.createElement('div');
  shine.classList.add('shine');
  shine.style.left = Math.random() * 100 + 'vw';
  document.body.appendChild(shine);
  setTimeout(() => shine.remove(), 3000);
}
setInterval(createShine, 300);
</script>
</body>
</html>
